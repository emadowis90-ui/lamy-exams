<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبارات الأكثر تكراراً</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: exam console — top bar with section stepper + timer; two panes (questions | passage), stacked on phones */
:root{
  --bg:#EEF2F1; --paper:#FFFFFF; --ink:#13262A; --muted:#5B6E70; --line:#D3DCDB;
  --accent:#0D6A63; --accent-soft:#DCEFEC; --accent-ink:#FFFFFF;
  --warn:#B86E00; --warn-soft:#FCEFD9; --bad:#B3261E; --bad-soft:#FBE3E1; --good:#1E7A3A; --good-soft:#DFF2E4;
  --mark:#F3D36B;
  --f-ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-read:"Noto Naskh Arabic", "Traditional Arabic", "Times New Roman", serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1719; --paper:#152225; --ink:#E4ECEB; --muted:#93A6A7; --line:#27393C;
  --accent:#3FB3A6; --accent-soft:#16383A; --accent-ink:#06201E;
  --warn:#F0A63A; --warn-soft:#3A2A10; --bad:#F2867D; --bad-soft:#3D1D1B; --good:#6BCB86; --good-soft:#16321F;
  --mark:#6B5A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1719; --paper:#152225; --ink:#E4ECEB; --muted:#93A6A7; --line:#27393C;
  --accent:#3FB3A6; --accent-soft:#16383A; --accent-ink:#06201E;
  --warn:#F0A63A; --warn-soft:#3A2A10; --bad:#F2867D; --bad-soft:#3D1D1B; --good:#6BCB86; --good-soft:#16321F;
  --mark:#6B5A1C; color-scheme:dark}
html,body,#app{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;direction:rtl}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Home ---------- */
#home{max-width:1100px;margin:0 auto;padding-block:28px 48px}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:0;text-wrap:balance}
.brand .sub{color:var(--muted);margin:2px 0 0}
.rules{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.legend{margin:18px 0 8px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s, transform .15s}
.tcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.tcard .num{font-size:22px;font-weight:700}
.tcard .from{font-family:var(--f-read);font-size:14px;color:var(--muted);min-height:2.6em}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.score-pill{border-radius:999px;padding:1px 10px;font-weight:600;font-size:12.5px}
.score-pill.none{background:var(--bg);color:var(--muted)}
.score-pill.ok{background:var(--good-soft);color:var(--good)}
.score-pill.mid{background:var(--warn-soft);color:var(--warn)}
.score-pill.low{background:var(--bad-soft);color:var(--bad)}
.foot{margin-top:22px;color:var(--muted);font-size:13px}

/* ---------- Exam ---------- */
#exam{height:100%;display:flex;flex-direction:column}
.bar{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;max-width:1400px;margin:0 auto}
.bar .title{font-weight:700;font-size:17px}
.steps{display:flex;gap:6px;align-items:center}
.step{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.step.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.step.done{background:var(--bg);text-decoration:line-through;opacity:.75}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:2px 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent);min-width:88px;text-align:center}
.timer.warn{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.timer.crit{animation:none}.tcard{transition:none}}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;max-width:1400px;width:100%;margin:0 auto;gap:0}
.pane{min-width:0;min-height:0;overflow:auto;padding-block:18px 24px}
.qpane{border-left:1px solid var(--line)}
.ppane{background:var(--paper)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.qno{font-weight:700;font-size:15px}
.type{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.flagbtn{margin-inline-start:auto;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.flagbtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.stem{font-family:var(--f-read);font-size:20px;line-height:1.95;font-weight:600;margin:6px 0 16px;text-wrap:pretty}
.stem.analogy{font-size:26px;text-align:center;padding:14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--paper)}
.stem mark{background:transparent;color:var(--bad);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:11px 14px;font-family:var(--f-read);font-size:18px;line-height:1.6}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-size:15px;font-weight:700;background:var(--bg);color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;position:relative}
.dot.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.dot.flag::after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--paper)}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.qfoot .spacer{flex:1}

.ptitle{font-weight:700;font-size:16px;color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ptitle::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}
.ptext{font-family:var(--f-read);font-size:18px;line-height:2.05;max-width:68ch}
.ptext p{margin:0 0 12px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.empty .big{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty .tip{max-width:36ch;font-size:14px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(5,15,16,.55);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--paper);color:var(--ink);border-radius:14px;max-width:440px;width:100%;padding:22px;border:1px solid var(--line)}
.modal h3{margin:0 0 8px;font-size:19px}
.modal p{margin:0 0 6px;color:var(--muted)}
.modal .row{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}

/* ---------- results ---------- */
#result{max-width:980px;margin:0 auto;padding-block:26px 48px}
.rhead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.rhead h2{margin:0;font-size:26px}
.total{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.total small{font-size:18px;color:var(--muted);font-weight:500}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sec .k{color:var(--muted);font-size:13px}
.sec .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar2{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.rv.wrong{border-inline-start:4px solid var(--bad)}
.rv.right{border-inline-start:4px solid var(--good)}
.rv.skip{border-inline-start:4px solid var(--muted)}
.rv .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.rv .s{font-family:var(--f-read);font-size:17px;font-weight:600;line-height:1.9}
.rv ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.rv li{font-family:var(--f-read);font-size:16px;padding:3px 10px;border-radius:6px}
.rv li.c{background:var(--good-soft);color:var(--good);font-weight:600}
.rv li.x{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.rv .note{margin-top:8px;font-size:13.5px;color:var(--ink);background:var(--bg);border-radius:6px;padding:6px 10px}
.rv details{margin-top:8px}
.rv details summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.rv details .ptext{font-size:16px;line-height:1.9;margin-top:6px}

@media (max-width:820px){
  .panes{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .ppane{order:-1;max-height:38vh;border-bottom:1px solid var(--line)}
  .ppane.none{display:none}
  .qpane{border-left:0}
  .stem{font-size:18px}.stem.analogy{font-size:22px}
  .opt{font-size:17px}
  .bar .title{font-size:15px}
  .bar-in{gap:8px 10px;padding-block:8px}
  .bar .chip{display:none}
  .step{padding:2px 8px;font-size:12px}
  .timer{font-size:17px;min-width:70px;padding:2px 8px}
  .btn{padding:6px 11px}
  #exam{height:auto;min-height:100%}
  .pane{overflow:visible}
  .ppane{overflow:auto}
}
</style>


</head>
<body>
<div id="app"></div>

<script>
const DATA={chapters:[],passages:[]};
window.addPart=function(p){const off=DATA.passages.length;p.passages.forEach(x=>DATA.passages.push(x));p.chapters.forEach(c=>{c.q.forEach(q=>{if(q.p!=null)q.p+=off});DATA.chapters.push(c)});};
(function load(i){const s=document.createElement('script');s.src='part-'+String(i).padStart(2,'0')+'.js';s.onload=()=>load(i+1);s.onerror=()=>boot();document.head.appendChild(s);})(1);
function boot(){
const TYPES = {"ت":"التناظر اللفظي","ك":"إكمال الجمل","خ":"الخطأ السياقي","س":"استيعاب المقروء"};
const LET = ["أ","ب","ج","د"];
const SEC_SIZE = 10, SECS = 3, SEC_TIME = 600;
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");

/* build flat list + tests */
const ALL = [];
DATA.chapters.forEach(ch => ch.q.forEach((q, i) => ALL.push({...q, ch: ch.n, chTitle: ch.title, qi: i + 1})));
const TESTS = [];
for (let i = 0; i < ALL.length; i += SEC_SIZE * SECS) {
  const qs = ALL.slice(i, i + SEC_SIZE * SECS);
  const sections = [];
  for (let s = 0; s < qs.length; s += SEC_SIZE) sections.push(qs.slice(s, s + SEC_SIZE));
  const chs = [...new Set(qs.map(q => q.ch))];
  TESTS.push({ n: TESTS.length + 1, sections, chs, titles: chs.map(c => DATA.chapters.find(x => x.n === c).title) });
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let S = null, tick = null;

/* ---------------- HOME ---------------- */
function home(){
  clearInterval(tick); S = null;
  const best = store.get("lamy-best") || {};
  app.innerHTML = `
  <main id="home" class="wrap">
    <header class="brand">
      <div>
        <h1>الأقسام الأكثر تكراراً في المحوسب</h1>
        <p class="sub">اختبارات القدرات العامة · القسم اللفظي · ${ar(ALL.length)} سؤالاً في ${ar(TESTS.length)} اختبارات</p>
      </div>
      <div class="rules">
        <span class="chip"><b>٣</b> أقسام لكل اختبار</span>
        <span class="chip"><b>١٠</b> أسئلة لكل قسم</span>
        <span class="chip"><b>١٠</b> دقائق لكل قسم</span>
        <span class="chip">لا رجوع للقسم السابق</span>
      </div>
    </header>
    <p class="legend">اختر اختباراً للبدء. الأسئلة بترتيب الكتاب، وكل اختبار يغطي القطع المذكورة في بطاقته.</p>
    <section class="grid">
      ${TESTS.map(t => {
        const b = best[t.n], tot = t.sections.flat().length;
        let cls = "none", lbl = "لم يُحل";
        if (b != null){ const p = b / tot; cls = p >= .8 ? "ok" : p >= .5 ? "mid" : "low"; lbl = `أفضل نتيجة ${ar(b)}/${ar(tot)}`; }
        return `<button class="tcard" data-t="${t.n}">
          <span class="num">اختبار ${ar(t.n)}</span>
          <span class="from">${t.chs.map((c,i)=>`${ar(c)}. ${esc(t.titles[i])}`).join(" · ")}</span>
          <span class="meta"><span>${ar(t.sections.length)} أقسام · ${ar(tot)} سؤالاً</span><span class="score-pill ${cls}">${lbl}</span></span>
        </button>`; }).join("")}
    </section>
    <p class="foot">المصدر: ملزمة «الأقسام الأكثر تكراراً في المحوسب» إعداد إيهاب عبد العظيم. الإجابات كما هي محددة في الملزمة، والعلاقات تظهر في صفحة المراجعة بعد انتهاء الاختبار.</p>
  </main>`;
  app.querySelectorAll(".tcard").forEach(b => b.onclick = () => start(+b.dataset.t));
  window.scrollTo(0,0);
}

/* ---------------- EXAM ---------------- */
function start(n){
  const t = TESTS[n-1];
  S = { t, sec: 0, cur: 0, ans: t.sections.map(s => s.map(() => null)), flag: t.sections.map(s => s.map(() => false)),
        left: SEC_TIME, used: [], modal: null };
  runTimer(); render();
}
function runTimer(){
  clearInterval(tick);
  const end = Date.now() + S.left * 1000;
  tick = setInterval(() => {
    S.left = Math.max(0, Math.round((end - Date.now()) / 1000));
    const el = document.getElementById("timer");
    if (el){ el.textContent = fmt(S.left); el.className = "timer" + (S.left <= 60 ? " crit" : S.left <= 180 ? " warn" : ""); }
    if (S.left <= 0){ clearInterval(tick); S.modal = "timeup"; render(); }
  }, 250);
}
const fmt = s => ar(String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"));

function stemHTML(q){
  let s = esc(q.s);
  if (q.t === "خ"){
    q.o.filter(Boolean).forEach(w => {
      const e = esc(w); const i = s.indexOf(e);
      if (i >= 0) s = s.slice(0,i) + "\u0000" + e + "\u0001" + s.slice(i + e.length);
    });
    s = s.replace(/\u0000/g,"<mark>").replace(/\u0001/g,"</mark>");
  }
  return s.replace(/\.{4,}|…+/g, m => '<span style="letter-spacing:2px;color:var(--muted)">........</span>');
}
function passageHTML(p){
  return `<h2 class="ptitle">${esc(p.title)}</h2><div class="ptext">${p.text.split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}</div>`;
}

function render(){
  const sec = S.t.sections[S.sec], q = sec[S.cur], a = S.ans[S.sec][S.cur];
  const p = q.p != null ? DATA.passages[q.p] : null;
  const answered = S.ans[S.sec].filter(x => x != null).length;
  app.innerHTML = `
  <div id="exam">
    <div class="bar"><div class="bar-in wrap">
      <span class="title">اختبار ${ar(S.t.n)}</span>
      <div class="steps">${S.t.sections.map((_,i)=>`<span class="step ${i<S.sec?"done":i===S.sec?"cur":""}">القسم ${ar(i+1)}</span>`).join("")}</div>
      <span class="spacer"></span>
      <span class="chip">أُجيب <b>${ar(answered)}</b> من ${ar(sec.length)}</span>
      <span id="timer" class="timer">${fmt(S.left)}</span>
      <button class="btn primary" id="endSec">${S.sec < S.t.sections.length-1 ? "إنهاء القسم" : "إنهاء الاختبار"}</button>
    </div></div>
    <div class="panes">
      <section class="pane qpane wrap" aria-label="السؤال">
        <div class="qhead">
          <span class="qno">السؤال ${ar(S.cur+1)} من ${ar(sec.length)}</span>
          <span class="type">${TYPES[q.t]}</span>
          <button class="flagbtn ${S.flag[S.sec][S.cur]?"on":""}" id="flag">${S.flag[S.sec][S.cur]?"معلَّم للمراجعة":"تعليم للمراجعة"}</button>
        </div>
        <div class="stem ${q.t==="ت"?"analogy":""}">${stemHTML(q)}</div>
        <div class="opts" role="radiogroup">
          ${q.o.map((o,i)=> o ? `<button class="opt ${a===i?"sel":""}" role="radio" aria-checked="${a===i}" data-i="${i}"><span class="l">${LET[i]}</span><span>${esc(o)}</span></button>` : "").join("")}
        </div>
        <div class="qfoot">
          <button class="btn" id="prev" ${S.cur===0?"disabled":""}>السابق</button>
          <button class="btn" id="next" ${S.cur===sec.length-1?"disabled":""}>التالي</button>
          <span class="spacer"></span>
          ${a!=null?`<button class="btn ghost" id="clear">مسح الإجابة</button>`:""}
        </div>
        <nav class="qnav" aria-label="أسئلة القسم">
          ${sec.map((_,i)=>`<button class="dot ${S.ans[S.sec][i]!=null?"ans":""} ${i===S.cur?"cur":""} ${S.flag[S.sec][i]?"flag":""}" data-j="${i}">${ar(i+1)}</button>`).join("")}
        </nav>
      </section>
      <section class="pane ppane wrap ${p?"":"none"}" aria-label="القطعة">
        ${p ? passageHTML(p) : `<div class="empty"><div><div class="big">لا توجد قطعة لهذا السؤال</div><div class="tip">${q.t==="ت"?"اختر الزوج الذي تشبه علاقته علاقة الزوج في رأس السؤال.":q.t==="ك"?"اختر ما يكمل الفراغ أو الفراغات بالمعنى الصحيح.":"حدد الكلمة التي لا تتسق مع المعنى العام للجملة. الكلمات المعنية ملوّنة في نص السؤال."}</div></div></div>`}
      </section>
    </div>
    ${S.modal ? modalHTML() : ""}
  </div>`;
  bindExam();
}
function modalHTML(){
  const last = S.sec === S.t.sections.length-1;
  if (S.modal === "confirm"){
    const un = S.ans[S.sec].filter(x=>x==null).length, fl = S.flag[S.sec].filter(Boolean).length;
    return `<div class="veil"><div class="modal" role="dialog" aria-modal="true">
      <h3>${last?"إنهاء الاختبار؟":"إنهاء القسم "+ar(S.sec+1)+"؟"}</h3>
      ${un?`<p>لديك <b style="color:var(--bad)">${ar(un)}</b> ${un>2&&un<11?"أسئلة":"سؤال"} بلا إجابة.</p>`:`<p>أجبت عن جميع أسئلة القسم.</p>`}
      ${fl?`<p>و${ar(fl)} معلَّمة للمراجعة.</p>`:""}
      <p>${last?"ستظهر النتيجة والمراجعة بعد الإنهاء.":"لن تتمكن من الرجوع إلى هذا القسم بعد الانتقال."}</p>
      <div class="row"><button class="btn primary" id="mOk">${last?"إنهاء وعرض النتيجة":"انتقل للقسم "+ar(S.sec+2)}</button><button class="btn" id="mNo">متابعة الحل</button></div>
    </div></div>`;
  }
  return `<div class="veil"><div class="modal" role="dialog" aria-modal="true">
    <h3>انتهى وقت القسم ${ar(S.sec+1)}</h3>
    <p>${last?"انتهى الاختبار. اضغط لعرض النتيجة.":"تم حفظ إجاباتك، وسيبدأ القسم التالي بعشر دقائق جديدة."}</p>
    <div class="row"><button class="btn primary" id="mOk">${last?"عرض النتيجة":"ابدأ القسم "+ar(S.sec+2)}</button></div>
  </div></div>`;
}
function bindExam(){
  const $ = id => document.getElementById(id);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.ans[S.sec][S.cur] = +b.dataset.i; render(); });
  app.querySelectorAll(".dot").forEach(b => b.onclick = () => { S.cur = +b.dataset.j; render(); });
  if ($("prev")) $("prev").onclick = () => { if (S.cur>0){S.cur--; render();} };
  if ($("next")) $("next").onclick = () => { if (S.cur<S.t.sections[S.sec].length-1){S.cur++; render();} };
  if ($("clear")) $("clear").onclick = () => { S.ans[S.sec][S.cur] = null; render(); };
  $("flag").onclick = () => { S.flag[S.sec][S.cur] = !S.flag[S.sec][S.cur]; render(); };
  $("endSec").onclick = () => { S.modal = "confirm"; render(); };
  if ($("mNo")) $("mNo").onclick = () => { S.modal = null; render(); };
  if ($("mOk")) $("mOk").onclick = nextSection;
}
function nextSection(){
  S.used[S.sec] = SEC_TIME - S.left; S.modal = null;
  if (S.sec < S.t.sections.length-1){ S.sec++; S.cur = 0; S.left = SEC_TIME; runTimer(); render(); window.scrollTo(0,0); }
  else { clearInterval(tick); result(); }
}
document.addEventListener("keydown", e => {
  if (!S || S.modal || !document.getElementById("exam")) return;
  const k = e.key, sec = S.t.sections[S.sec];
  const map = {"1":0,"2":1,"3":2,"4":3,"أ":0,"ب":1,"ج":2,"د":3};
  if (k in map && sec[S.cur].o[map[k]]){ S.ans[S.sec][S.cur] = map[k]; render(); }
  else if (k === "ArrowLeft" && S.cur < sec.length-1){ S.cur++; render(); }
  else if (k === "ArrowRight" && S.cur > 0){ S.cur--; render(); }
});

/* ---------------- RESULT ---------------- */
let filter = "all";
function result(){
  const t = S.t;
  const per = t.sections.map((s,si) => s.filter((q,qi) => S.ans[si][qi] === q.a).length);
  const total = per.reduce((a,b)=>a+b,0), N = t.sections.flat().length;
  const best = store.get("lamy-best") || {};
  if (best[t.n] == null || total > best[t.n]){ best[t.n] = total; store.set("lamy-best", best); }
  const pct = Math.round(total / N * 100);
  const items = [];
  t.sections.forEach((s,si) => s.forEach((q,qi) => items.push({q, si, qi, a: S.ans[si][qi]})));
  const draw = () => {
    const list = items.filter(x => filter==="all" || (filter==="wrong" && x.a!==x.q.a) || (filter==="right" && x.a===x.q.a));
    document.getElementById("rlist").innerHTML = list.map(({q,si,qi,a}) => {
      const st = a==null ? "skip" : a===q.a ? "right" : "wrong";
      const p = q.p!=null ? DATA.passages[q.p] : null;
      return `<article class="rv ${st}">
        <div class="h"><b style="color:var(--ink)">القسم ${ar(si+1)} · سؤال ${ar(qi+1)}</b><span class="type">${TYPES[q.t]}</span>
        <span>${st==="right"?"إجابة صحيحة":st==="wrong"?"إجابة خاطئة":"لم تُجب"}</span><span>· القطعة ${ar(q.ch)}: ${esc(q.chTitle)}</span></div>
        <div class="s">${stemHTML(q)}</div>
        <ul>${q.o.map((o,i)=> o ? `<li class="${i===q.a?"c":i===a?"x":""}">${LET[i]}) ${esc(o)}</li>` : "").join("")}</ul>
        ${q.n?`<div class="note"><b>${q.t==="ت"?"العلاقة":"ملاحظة"}:</b> ${esc(q.n)}</div>`:""}
        ${p?`<details><summary>عرض القطعة</summary>${passageHTML(p)}</details>`:""}
      </article>`; }).join("") || `<p style="color:var(--muted)">لا توجد أسئلة في هذا التصنيف.</p>`;
    app.querySelectorAll(".filters button").forEach(b => b.classList.toggle("on", b.dataset.f===filter));
  };
  app.innerHTML = `
  <main id="result" class="wrap">
    <header class="rhead">
      <div><h2>نتيجة اختبار ${ar(t.n)}</h2><p style="margin:4px 0 0;color:var(--muted)">${t.chs.map((c,i)=>`${ar(c)}. ${esc(t.titles[i])}`).join(" · ")}</p></div>
      <div style="text-align:left"><div class="total"><bdi>${ar(total)} / ${ar(N)}</bdi></div><div style="color:var(--muted);font-weight:600">النسبة ${ar(pct)}٪</div></div>
    </header>
    <div class="secs">${per.map((v,i)=>`<div class="sec"><div class="k">القسم ${ar(i+1)} · الوقت المستغرق ${fmt(S.used[i]||0)}</div><div class="v">${ar(v)} / ${ar(t.sections[i].length)}</div><div class="bar2"><i style="width:${v/t.sections[i].length*100}%"></i></div></div>`).join("")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="again">إعادة الاختبار</button>
      ${t.n < TESTS.length ? `<button class="btn" id="nextT">الاختبار التالي</button>` : ""}
      <button class="btn" id="back">كل الاختبارات</button>
    </div>
    <div class="filters">
      <button data-f="all">الكل (${ar(N)})</button>
      <button data-f="wrong">الأخطاء وغير المجاب (${ar(N-total)})</button>
      <button data-f="right">الصحيحة (${ar(total)})</button>
    </div>
    <div id="rlist"></div>
  </main>`;
  app.querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
  const n = t.n; filter = "all"; draw();
  document.getElementById("again").onclick = () => start(n);
  document.getElementById("back").onclick = home;
  if (document.getElementById("nextT")) document.getElementById("nextT").onclick = () => start(n+1);
  window.scrollTo(0,0);
}

home();
}
</script>

</body>
</html>
